# Dependency review: an independent check on every pull request that changes
# dependencies (package.json/bun.lock, workflow actions). GitHub compares the
# PR against its advisory database and fails the check if the PR would add a
# package with a known high or critical vulnerability. It also comments a
# summary of what changed. Free for public repositories.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the summary comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
