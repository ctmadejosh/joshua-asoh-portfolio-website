    <script>
      // Pick the theme before first paint: a saved choice wins, else the system setting.
      // `js` turns on motion effects that degrade to plain, visible content without it.
      (function () {
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("js");
          // If the app hasn't started in 4s (blocked script, slow network), show everything.
          setTimeout(function () {
            if (!window.__appStarted) document.documentElement.classList.remove("js");
          }, 4000);
        }
        var dark;
        try { dark = localStorage.getItem("theme"); } catch (e) {}
        dark = dark ? dark === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B0E15");
        }
      })();
    </script>
