    <script>
      // Pick the theme before first paint: a saved choice wins, else the system setting.
      (function () {
        var dark;
        try { dark = localStorage.getItem("theme"); } catch (e) {}
        dark = dark ? dark === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B0E15");
        }
      })();
    </script>
